name: Validar foundation experimental
on:
  push:
    branches: [experimental/foundation-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ecosystem/packages/download_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart test
  queue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ecosystem/packages/download_queue
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  windows-prototype:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Preparar plataforma Windows
        working-directory: ecosystem/apps/desktop
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name lexair_desktop .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item app_icon.ico windows/runner/resources/app_icon.ico -Force
          flutter pub get
      - name: Analizar y probar
        working-directory: ecosystem/apps/desktop
        run: |
          flutter analyze --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Empaquetar prototipo (no publicar como release)
        working-directory: ecosystem/apps/desktop
        shell: pwsh
        run: |
          Copy-Item ../../ESTADO.md build/windows/x64/runner/Release/PROTOTIPO-LEEME.md
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Lexair-Download-EXPERIMENTAL-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lexair-Download-EXPERIMENTAL-Windows
          path: ecosystem/apps/desktop/Lexair-Download-EXPERIMENTAL-Windows.zip
          if-no-files-found: error
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecosystem/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecosystem/apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

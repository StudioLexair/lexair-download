name: Compilar Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Crear plataforma Windows
        run: flutter create --platforms=windows --project-name lexair_downloader .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Incluir yt-dlp
        shell: pwsh
        run: |
          $dest = 'build/windows/x64/runner/Release/yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile $dest
          & $dest --version
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo verificar yt-dlp' }
      - name: Preparar paquete
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Lexair-Download-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lexair-Download-Windows
          path: Lexair-Download-Windows.zip
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lexair-Download-Windows.zip
          generate_release_notes: true
